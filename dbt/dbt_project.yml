name: uk_energy
version: "1.0.0"
config-version: 2
profile: uk_energy

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Heating degree days use the common UK base temperature of 15.5 C.
  hdd_base_c: 15.5

models:
  uk_energy:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  uk_energy:
    +schema: reference

data_tests:
  uk_energy:
    +store_failures: false
